name: Deploy to WordPress.org

# Fires on the "vX.Y.Z" tag pushed by version-tag.yml. Deploys trunk + a
# matching SVN tag to the wp.org plugin repo and attaches a release zip to
# the GitHub Release. Needs SVN_USERNAME / SVN_PASSWORD secrets (your wp.org
# plugin-committer credentials).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deploy:
    name: SVN deploy + GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: romcommerce

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
