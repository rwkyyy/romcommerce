name: Deploy to WordPress.org

# Fires on the "vX.Y.Z" tag pushed by version-tag.yml. Deploys trunk + a
# matching SVN tag to the wp.org plugin repo and attaches a release zip to
# the GitHub Release. Needs SVN_USERNAME / SVN_PASSWORD secrets (your wp.org
# plugin-committer credentials).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deploy:
    name: SVN deploy + GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The deploy action copies the workspace to SVN minus .distignore, and
      # checkout leaves .git/ in it: a dropped .distignore line would publish
      # git metadata to the public wp.org repo.
      - name: Refuse to ship git metadata
        run: |
          staged="$(mktemp -d)"
          rsync -a --exclude-from=.distignore ./ "$staged"/
          leaked="$(find "$staged" \( -name .git -o -name .github \) -print)"
          if [ -n "$leaked" ]; then
            echo "::error::.distignore lets these through to wp.org: $leaked"
            exit 1
          fi

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: romcommerce

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
