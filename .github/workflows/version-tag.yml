name: Tag release on version bump

# Runs the full CI suite (ci.yml) on every push to main, then pushes a "vX.Y.Z"
# tag when romcommerce.php's Version header has moved past the latest tag.
# That tag push is what release.yml (wp.org SVN deploy) reacts to, so nothing
# reaches wp.org unless every check in ci.yml passed on that exact commit.
#
# Requires a secrets.RELEASE_TOKEN (a PAT with "Contents: read and write" on
# this repo) instead of the default GITHUB_TOKEN: tags pushed with the default
# token don't trigger other workflows (GitHub's anti-recursion guard), so
# release.yml would never fire.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  tag:
    name: Tag if version changed
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # RELEASE_TOKEN is handed to the push step only, so it never sits in
          # .git/config while dependencies and tests run in this job.
          persist-credentials: false

      - name: Read plugin version
        id: version
        run: |
          HEADER_VERSION=$(grep -m1 "Version:" romcommerce.php | sed -E 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//')
          STABLE_TAG=$(grep -m1 "^Stable tag:" readme.txt | sed -E 's/^Stable tag:[[:space:]]*//')

          if [ "$HEADER_VERSION" != "$STABLE_TAG" ]; then
            echo "::error::romcommerce.php Version ($HEADER_VERSION) and readme.txt Stable tag ($STABLE_TAG) disagree."
            exit 1
          fi

          echo "version=$HEADER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already tagged
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and push
        if: steps.check.outputs.already_tagged == 'false'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${{ steps.version.outputs.version }}"
